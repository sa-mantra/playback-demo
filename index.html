<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NVR Mobile</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mux.js/dist/mux.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Exact same tokens as index.html ── */
    :root {
      --bg:      #0d0f12;
      --surface: #161a20;
      --border:  #2a2f38;
      --accent:  #3b82f6;
      --accent2: #1d4ed8;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --ok:      #22c55e;
      --warn:    #f59e0b;
      --err:     #ef4444;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Screen switcher ── */
    .screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
    .screen.active { display: flex; }

    /* ══════════════════════════════════════════
       SHARED: header  (identical to index.html)
    ══════════════════════════════════════════ */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    header .badge {
      margin-left: auto;
      background: var(--border);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--muted);
    }
    header .badge.ok  { background: rgba(34,197,94,.15);  color: var(--ok); }
    header .badge.err { background: rgba(239,68,68,.15);   color: var(--err); }

    /* ══════════════════════════════════════════
       SHARED: event list  (identical classes)
    ══════════════════════════════════════════ */
    .sidebar-header {
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .event-list { overflow-y: auto; flex: 1; }
    .event-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .event-item:hover  { background: rgba(59,130,246,0.08); }
    .event-item.active { background: rgba(59,130,246,0.18); border-left: 3px solid var(--accent); padding-left: 11px; }
    .thumb-wrap {
      width: 72px; height: 42px;
      border-radius: 5px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--border);
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-wrap .no-thumb {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: var(--muted);
    }
    .event-info { flex: 1; min-width: 0; }
    .event-info .ev-id {
      font-size: 11px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--accent);
    }
    .event-info .ev-device { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .event-info .ev-dur    { font-size: 11px; color: var(--text);  margin-top: 3px; }
    .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }

    /* ══════════════════════════════════════════
       SHARED: meta panel  (identical to index.html)
    ══════════════════════════════════════════ */
    .meta-panel {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      flex-shrink: 0;
    }
    .meta-panel.hidden { display: none; }
    .meta-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .meta-panel-title {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted);
    }
    .btn-download {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      background: var(--accent); color: #fff;
      border-radius: 6px; font-size: 12px; font-weight: 600;
      text-decoration: none; transition: background 0.15s;
    }
    .btn-download:hover { background: var(--accent2); }
    .btn-download.hidden { display: none; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px 20px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.8px; }
    .meta-value { font-size: 13px; color: var(--text); font-weight: 500; }
    .meta-value.mono { font-family: monospace; font-size: 12px; }

    /* ══════════════════════════════════════════
       SCREEN: Connect
    ══════════════════════════════════════════ */
    #screen-connect .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 20px;
    }
    .connect-sub { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }
    .form-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text); font-size: 14px; font-family: monospace;
      outline: none; -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .btn-connect {
      width: 100%; max-width: 340px;
      padding: 14px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; -webkit-appearance: none;
    }
    .btn-connect:active { opacity: 0.85; }

    /* ══════════════════════════════════════════
       SCREEN: Connecting
    ══════════════════════════════════════════ */
    #screen-connecting .body {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .connecting-label { font-size: 15px; font-weight: 600; }
    .connecting-step  { font-size: 12px; color: var(--muted); }
    .btn-cancel {
      margin-top: 4px; padding: 8px 24px;
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }

    /* ══════════════════════════════════════════
       SCREEN: Clips  (sidebar look, full width)
    ══════════════════════════════════════════ */
    /* no extra styles — uses shared event-list classes */

    /* ══════════════════════════════════════════
       SCREEN: Player
    ══════════════════════════════════════════ */
    #screen-player { overflow-y: auto; }
    #screen-player header .back-btn {
      padding: 4px 10px;
      background: var(--border);
      border: none; border-radius: 6px;
      color: var(--text); font-size: 13px;
      cursor: pointer; margin-right: 2px;
    }
    #screen-player header .clip-id-label {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .player-area {
      background: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      /* 16:9 aspect ratio */
      aspect-ratio: 16/9;
      width: 100%;
      flex-shrink: 0;
    }
    .player-area video {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .player-placeholder {
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      color: var(--muted); font-size: 14px;
    }
    .player-placeholder .icon { font-size: 48px; }
    #status-overlay {
      position: absolute;
      top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; color: var(--text);
      display: none; white-space: nowrap;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ══ CONNECT ═══════════════════════════════════════════════════════════════ -->
<div id="screen-connect" class="screen active">
  <header>
    <div class="logo">📹</div>
    <h1>NVR Mobile</h1>
    <span class="badge" id="connect-badge">Disconnected</span>
  </header>
  <div class="body">
    <div class="connect-sub">Connect to your hub over WebRTC.<br>Works on the same LAN or remotely.</div>
    <div class="form-group">
      <label class="form-label" for="input-hub-id">Hub ID</label>
      <input id="input-hub-id" class="form-input" type="text"
             value="hub-home-abc123"
             autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
    </div>
    <button id="btn-connect" class="btn-connect">Connect</button>
  </div>
</div>

<!-- ══ CONNECTING ════════════════════════════════════════════════════════════ -->
<div id="screen-connecting" class="screen">
  <header>
    <div class="logo">📹</div>
    <h1>NVR Mobile</h1>
    <span class="badge" id="connecting-badge">Connecting…</span>
  </header>
  <div class="body">
    <div class="spinner"></div>
    <div class="connecting-label">Establishing connection</div>
    <div id="connecting-step" class="connecting-step">Starting MQTT signaling…</div>
    <button id="btn-cancel" class="btn-cancel">Cancel</button>
  </div>
</div>

<!-- ══ CLIPS ═════════════════════════════════════════════════════════════════ -->
<div id="screen-clips" class="screen">
  <header>
    <div class="logo">📹</div>
    <h1>NVR Mobile</h1>
    <span class="badge ok" id="event-count">0 events</span>
  </header>
  <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;">
    <span>Recorded Events</span>
    <button id="btn-disconnect" style="background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 6px;">Disconnect</button>
  </div>
  <div class="event-list" id="event-list">
    <div class="empty-state"><div class="icon">⏳</div>Loading events…</div>
  </div>
</div>

<!-- ══ PLAYER ════════════════════════════════════════════════════════════════ -->
<div id="screen-player" class="screen">
  <header>
    <button id="btn-back" class="back-btn">← Back</button>
    <div class="logo">📹</div>
    <span id="player-clip-id" class="clip-id-label"></span>
  </header>

  <div class="player-area">
    <div class="player-placeholder" id="placeholder">
      <div class="icon">▶️</div>
      <span>Loading…</span>
    </div>
    <video id="player-video" controls playsinline style="display:none"></video>
    <div id="status-overlay"></div>
  </div>

  <div class="meta-panel hidden" id="meta-panel">
    <div class="meta-panel-header">
      <span class="meta-panel-title">Clip Details</span>
    </div>
    <div class="meta-grid" id="meta-grid"></div>
  </div>
</div>

<script>
'use strict';

// ── Utilities ──────────────────────────────────────────────────────────────────
function uuid() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
}
function fmt(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ── Screen navigation ──────────────────────────────────────────────────────────
const SCREENS = ['connect','connecting','clips','player'];
function showScreen(name) {
  SCREENS.forEach(id => {
    document.getElementById(`screen-${id}`).classList.toggle('active', id === name);
  });
}

// ── Status overlay (player screen) ────────────────────────────────────────────
const statusEl = document.getElementById('status-overlay');
function showStatus(msg, dur = 3000) {
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
  clearTimeout(showStatus._t);
  if (dur) showStatus._t = setTimeout(() => { statusEl.style.display = 'none'; }, dur);
}
function hideStatus() { statusEl.style.display = 'none'; }

// ── Connection state ───────────────────────────────────────────────────────────
let mqttClient  = null;
let peerConn    = null;
let dataChannel = null;
let sessionId   = null;
let currentHubId = null;
let pending     = null; // segment reassembly

const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

// ── Connecting step label ──────────────────────────────────────────────────────
function setStep(msg) { document.getElementById('connecting-step').textContent = msg; }

// ── Connect ────────────────────────────────────────────────────────────────────
let connectTimer = null;
function startConnectTimeout() {
  connectTimer = setTimeout(() => {
    teardown(); showScreen('connect');
    alert('Connection timed out. Is the hub running?');
  }, 15000);
}
function clearConnectTimeout() { clearTimeout(connectTimer); connectTimer = null; }

function connect(hubId) {
  currentHubId = hubId;
  sessionId    = uuid();
  showScreen('connecting');
  setStep('Connecting to MQTT broker…');
  startConnectTimeout();

  const offerTopic    = `nvr/hub/${hubId}/signal`;
  const answerTopic   = `nvr/hub/${hubId}/signal/reply`;
  const iceTopic      = `nvr/hub/${hubId}/ice`;
  const iceReplyTopic = `nvr/hub/${hubId}/ice/reply`;

  mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: `nvr-mobile-${Math.random().toString(16).slice(2, 10)}`,
    connectTimeout: 10000,
    reconnectPeriod: 0,
  });

  mqttClient.on('connect', () => {
    setStep('Connected — subscribing…');
    mqttClient.subscribe([answerTopic, iceReplyTopic], err => {
      if (err) { teardown(); showScreen('connect'); return; }
      setStep('Creating WebRTC offer…');
      createOffer(hubId, offerTopic, iceTopic);
    });
  });

  mqttClient.on('error', err => { teardown(); showScreen('connect'); });

  mqttClient.on('message', (topic, payload) => {
    let msg;
    try { msg = JSON.parse(payload.toString()); } catch { return; }
    if (msg.session_id && msg.session_id !== sessionId) return;

    if (topic === answerTopic && msg.type === 'answer') {
      peerConn.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
      setStep('Answer received — waiting for ICE…');
      return;
    }
    if (topic === iceReplyTopic && msg.candidate) {
      peerConn.addIceCandidate({ candidate: msg.candidate, sdpMid: msg.sdpMid || '0' }).catch(() => {});
      return;
    }
  });
}

function createOffer(hubId, offerTopic, iceTopic) {
  peerConn = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  dataChannel = peerConn.createDataChannel('clip-stream', { ordered: true });
  dataChannel.binaryType = 'arraybuffer';

  dataChannel.onopen = () => {
    clearConnectTimeout();
    document.getElementById('event-count').textContent = 'Connected';
    showScreen('clips');
    requestClips();
  };

  dataChannel.onclose = () => {
    if (['clips','player'].some(s => document.getElementById(`screen-${s}`).classList.contains('active'))) {
      teardown(); showScreen('connect');
    }
  };

  dataChannel.onmessage = handleDCMessage;

  peerConn.onicecandidate = e => {
    if (!e.candidate) return;
    mqttClient.publish(iceTopic, JSON.stringify({
      candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, session_id: sessionId,
    }));
  };

  peerConn.oniceconnectionstatechange = () => {
    const s = peerConn.iceConnectionState;
    setStep(`ICE: ${s}`);
    if (s === 'failed') {
      teardown(); showScreen('connect');
      alert('ICE connection failed. Add TURN credentials for remote access.');
    }
  };

  peerConn.createOffer()
    .then(o => peerConn.setLocalDescription(o))
    .then(() => {
      mqttClient.publish(offerTopic, JSON.stringify({
        type: peerConn.localDescription.type,
        sdp:  peerConn.localDescription.sdp,
        session_id: sessionId,
      }));
      setStep('Offer sent — waiting for hub…');
    })
    .catch(() => { teardown(); showScreen('connect'); });
}

// ── Teardown ───────────────────────────────────────────────────────────────────
function teardown() {
  clearConnectTimeout();
  stopPlayback();
  if (dataChannel) { try { dataChannel.close(); } catch {} dataChannel = null; }
  if (peerConn)    { try { peerConn.close();    } catch {} peerConn    = null; }
  if (mqttClient)  { mqttClient.end(true);                  mqttClient  = null; }
  sessionId = null; currentHubId = null; pending = null;
}

// ── DataChannel messaging ──────────────────────────────────────────────────────
function dcSend(obj) {
  if (dataChannel && dataChannel.readyState === 'open') dataChannel.send(JSON.stringify(obj));
}
function requestClips() { dcSend({ type: 'get_clips' }); }

function handleDCMessage(event) {
  if (event.data instanceof ArrayBuffer) {
    if (!pending) return;
    pending.chunks.push(new Uint8Array(event.data));
    pending.received += event.data.byteLength;
    return;
  }
  let msg;
  try { msg = JSON.parse(event.data); } catch { return; }

  if (msg.type === 'clips')          { renderClips(msg.data);                                        return; }
  if (msg.type === 'thumb_chunk')    { receiveThumbChunk(msg);                                       return; }
  if (msg.type === 'segment_header') { pending = { clip_id: msg.clip_id, segment_index: msg.segment_index, total: msg.size_bytes, received: 0, chunks: [] }; return; }
  if (msg.type === 'segment_end')    { if (!pending) return; const p = pending; pending = null; assembleSegment(p); return; }
  if (msg.type === 'error')          { showStatus(`Hub: ${msg.message}`, 5000); return; }
}

// ── Thumbnail (chunked base64 over DataChannel) ────────────────────────────────
const thumbChunks = new Map(); // clip_id → { chunks[], received, total }

function receiveThumbChunk(msg) {
  if (!thumbChunks.has(msg.clip_id)) {
    thumbChunks.set(msg.clip_id, { chunks: new Array(msg.total), received: 0, total: msg.total });
  }
  const state = thumbChunks.get(msg.clip_id);
  state.chunks[msg.index] = msg.data;
  state.received++;
  if (state.received === state.total) {
    thumbChunks.delete(msg.clip_id);
    applyThumbnail(msg.clip_id, state.chunks.join(''));
  }
}

function applyThumbnail(clipId, b64) {
  const wrap = document.querySelector(`[data-clip-thumb="${clipId}"]`);
  if (!wrap) return;
  wrap.innerHTML = `<img src="data:image/jpeg;base64,${b64}" alt="thumb" style="width:100%;height:100%;object-fit:cover;">`;
}

// ── Clip list ─────────────────────────────────────────────────────────────────
function renderClips(list) {
  const el = document.getElementById('event-list');
  const badge = document.getElementById('event-count');

  if (!list || !list.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div>No events found on hub.</div>';
    badge.textContent = '0 events';
    return;
  }

  badge.textContent = `${list.length} event${list.length !== 1 ? 's' : ''}`;
  el.innerHTML = '';

  list.forEach(meta => {
    const c   = meta.clip;
    const item = document.createElement('div');
    item.className = 'event-item';

    const date = new Date(c.created_at).toLocaleDateString();
    const time = new Date(c.created_at).toLocaleTimeString();

    item.innerHTML = `
      <div class="thumb-wrap" data-clip-thumb="${c.id}">
        <div class="no-thumb">🎬</div>
      </div>
      <div class="event-info">
        <div class="ev-id">${c.id}</div>
        <div class="ev-device">📷 ${c.device_id}</div>
        <div class="ev-dur">${fmt(c.duration_seconds)} &nbsp;·&nbsp; ${date} ${time}</div>
      </div>`;

    item.addEventListener('click', () => {
      document.querySelectorAll('.event-item').forEach(e => e.classList.remove('active'));
      item.classList.add('active');
      playClip(meta);
    });
    el.appendChild(item);
  });

  // Request thumbnails over DataChannel — avoids any HTTP dependency
  list.forEach(meta => dcSend({ type: 'get_thumbnail', clip_id: meta.clip.id }));
}

// ── Playback (MSE + mux.js) ───────────────────────────────────────────────────
const videoEl   = document.getElementById('player-video');
const metaPanel = document.getElementById('meta-panel');
const metaGrid  = document.getElementById('meta-grid');
const placeholder = document.getElementById('placeholder');

let mediaSource  = null;
let sourceBuffer = null;
let transmuxer   = null;
let playingMeta  = null;
let nextSegment  = 0;
let segmentCount = 0;
let sourceQueue  = [];
let sbBusy       = false;

function stopPlayback() {
  playingMeta = null;
  if (transmuxer)  { try { transmuxer.dispose(); } catch {} transmuxer  = null; }
  if (mediaSource && mediaSource.readyState === 'open') { try { mediaSource.endOfStream(); } catch {} }
  if (videoEl.src) { URL.revokeObjectURL(videoEl.src); videoEl.removeAttribute('src'); videoEl.load(); }
  mediaSource = null; sourceBuffer = null; sourceQueue = []; sbBusy = false;
}

function playClip(meta) {
  stopPlayback();
  playingMeta  = meta;
  nextSegment  = 0;
  segmentCount = meta.clip.segment_count;

  document.getElementById('player-clip-id').textContent = meta.clip.id;
  showScreen('player');
  placeholder.style.display = 'flex';
  videoEl.style.display = 'none';
  showStatus('Buffering…', 0);
  renderMeta(meta);

  mediaSource = new MediaSource();
  videoEl.src = URL.createObjectURL(mediaSource);

  mediaSource.addEventListener('sourceopen', () => {
    const mime = 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
    if (!MediaSource.isTypeSupported(mime)) { showStatus('Codec not supported', 5000); return; }

    sourceBuffer = mediaSource.addSourceBuffer(mime);
    sourceBuffer.addEventListener('updateend', drainQueue);

    transmuxer = new muxjs.mp4.Transmuxer();
    transmuxer.on('data', seg => {
      let buf;
      if (seg.initSegment && seg.initSegment.byteLength > 0) {
        buf = new Uint8Array(seg.initSegment.byteLength + seg.data.byteLength);
        buf.set(seg.initSegment, 0);
        buf.set(new Uint8Array(seg.data), seg.initSegment.byteLength);
      } else {
        buf = new Uint8Array(seg.data);
      }
      sourceQueue.push(buf.buffer);
      drainQueue();
    });

    fetchSegment(0);
  }, { once: true });

  videoEl.ontimeupdate = () => {
    if (!playingMeta) return;
    const ahead = Math.floor(videoEl.currentTime / playingMeta.clip.segment_duration_seconds) + 2;
    if (ahead > nextSegment && nextSegment < segmentCount) fetchSegment(nextSegment);
  };
}

function drainQueue() {
  if (sbBusy || !sourceBuffer || sourceBuffer.updating || !sourceQueue.length) return;
  sbBusy = true;
  const chunk = sourceQueue.shift();
  try { sourceBuffer.appendBuffer(chunk); } catch (e) { sbBusy = false; }
  sourceBuffer.addEventListener('updateend', () => {
    sbBusy = false;
    if (sourceQueue.length) drainQueue();
    else if (nextSegment >= segmentCount && mediaSource && mediaSource.readyState === 'open') {
      try { mediaSource.endOfStream(); } catch {}
    }
  }, { once: true });
}

function fetchSegment(index) {
  if (index >= segmentCount) return;
  nextSegment = index + 1;
  showStatus(`Loading segment ${index + 1} / ${segmentCount}…`, 0);
  dcSend({ type: 'get_segment', clip_id: playingMeta.clip.id, segment_index: index });
}

function assembleSegment(p) {
  if (!playingMeta || playingMeta.clip.id !== p.clip_id) return;
  const full = new Uint8Array(p.total);
  let off = 0;
  for (const c of p.chunks) { full.set(c, off); off += c.length; }

  placeholder.style.display = 'none';
  videoEl.style.display = 'block';
  hideStatus();

  transmuxer.push(full);
  transmuxer.flush();

  videoEl.play().catch(() => {});

  const ahead = Math.floor(videoEl.currentTime / playingMeta.clip.segment_duration_seconds) + 2;
  if (ahead > nextSegment && nextSegment < segmentCount) fetchSegment(nextSegment);
}

// ── Meta panel (same fields as index.html) ────────────────────────────────────
function renderMeta(meta) {
  const c = meta.clip, v = meta.video, s = meta.storage;
  const fields = [
    { label: 'Event ID',    value: c.id,                                          cls: 'mono' },
    { label: 'Device',      value: c.device_id },
    { label: 'Created',     value: new Date(c.created_at).toLocaleString() },
    { label: 'Duration',    value: fmt(c.duration_seconds) },
    { label: 'Resolution',  value: `${v.resolution_width} × ${v.resolution_height}` },
    { label: 'FPS',         value: v.fps },
    { label: 'Video Codec', value: v.codec.toUpperCase() },
    { label: 'Audio Codec', value: v.audio_codec.toUpperCase() },
    { label: 'Bitrate',     value: `${v.bitrate_kbps} kbps` },
    { label: 'Segments',    value: `${c.segment_count} × ${c.segment_duration_seconds}s` },
    { label: 'Size',        value: `${(s.total_size_bytes / 1024 / 1024).toFixed(2)} MB` },
    { label: 'Trigger',     value: meta.trigger.type + ' / ' + meta.trigger.label },
  ];
  metaGrid.innerHTML = fields.map(f => `
    <div class="meta-item">
      <span class="meta-label">${f.label}</span>
      <span class="meta-value ${f.cls || ''}">${f.value}</span>
    </div>`).join('');
  metaPanel.classList.remove('hidden');
}

// ── Button wiring ──────────────────────────────────────────────────────────────
document.getElementById('btn-connect').addEventListener('click', () => {
  const hubId = document.getElementById('input-hub-id').value.trim();
  if (!hubId) return;
  connect(hubId);
});
document.getElementById('input-hub-id').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-connect').click();
});
document.getElementById('btn-cancel').addEventListener('click', () => {
  teardown(); showScreen('connect');
});
document.getElementById('btn-disconnect').addEventListener('click', () => {
  teardown(); showScreen('connect');
});
document.getElementById('btn-back').addEventListener('click', () => {
  stopPlayback();
  metaPanel.classList.add('hidden');
  showScreen('clips');
});
</script>
